<style>
:root{

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:

  font-size:16px; line-height:1.62; padding:28px 16px 60px;
}
.app{max-width:960px;margin:0 auto}
.hero h1{
  margin:0 0 6px; font-size:clamp(26px,4.2vw,38px); letter-spacing:.5px;
  background:linear-gradient(92deg,#8fc4ff,#c3b2ff 60%,#7ef0d0);
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.hero .sub{margin:0 0 22px;color:var(--dim);font-size:14.5px}
.card{
  background:var(--card); border:1px solid var(--line); border-radius:16px;
  padding:18px 18px 16px; margin-bottom:16px; backdrop-filter:blur(8px);
  box-shadow:0 12px 34px rgba(0,0,0,.28);
}
.lbl{display:block;font-size:13px;color:var(--dim);margin-bottom:8px;letter-spacing:.6px}
.input-row{display:flex;gap:10px;flex-wrap:wrap}
#eq{
  flex:1 1 320px; min-width:0; padding:15px 16px; font-size:19px; color:var(--txt);
  background:#0b1220; border:1px solid rgba(255,255,255,.14); border-radius:12px;
  font-family:"Cascadia Mono",Consolas,"Courier New",monospace; outline:none; transition:.18s;
}
#eq:focus{border-color:var(--acc);box-shadow:0 0 0 4px rgba(79,157,255,.16)}
#eq::placeholder{color:#5a6a80}
.btn{
  padding:14px 22px; font-size:16px; font-weight:600; color:#fff; cursor:pointer;
  border:1px solid rgba(255,255,255,.14); border-radius:12px; background:#1d2637; transition:.18s;
}
.btn:hover{transform:translateY(-1px);background:#243044}
.btn.primary{background:linear-gradient(96deg,var(--acc),var(--acc2));border-color:transparent}
.btn.primary:hover{box-shadow:0 8px 22px rgba(79,157,255,.32)}
.btn.small{padding:8px 14px;font-size:13.5px;border-radius:10px}
.btn.ghost{background:rgba(255,255,255,.04)}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.toolbar .tag{font-size:12.5px;color:var(--dim)}
#angleBtn{min-width:112px;font-family:"Cascadia Mono",Consolas,monospace}
#angleBtn[data-mode="rad"]{border-color:rgba(79,157,255,.55);color:#bcd9ff}
.hint{margin:10px 2px 0;color:var(--dim);font-size:13px}
.hint code,.mono{font-family:"Cascadia Mono",Consolas,monospace;color:#bcd4f0;background:rgba(255,255,255,.06);padding:1px 6px;border-radius:6px}
kbd{font-family:inherit;font-size:12px;background:rgba(255,255,255,.1);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.sol-card{border-color:rgba(53,211,154,.32);background:linear-gradient(180deg,rgba(53,211,154,.10),rgba(22,29,41,.85))}
.sol-card.warn{border-color:rgba(255,176,32,.34);background:linear-gradient(180deg,rgba(255,176,32,.10),rgba(22,29,41,.85))}
.calc-card{border-color:rgba(79,157,255,.34);background:linear-gradient(180deg,rgba(79,157,255,.10),rgba(22,29,41,.85))}
.sol-title{font-size:13px;color:var(--dim);letter-spacing:1px;margin:0 0 8px}
.sol-big{font-size:clamp(20px,3.4vw,27px);font-weight:600;line-height:1.5;word-break:break-word;font-family:"Cascadia Mono",Consolas,monospace}
.sol-big .ln{display:block}
.sol-sub{margin-top:6px;color:var(--dim);font-size:13.5px}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.meta-chip{font-size:12.5px;color:#cbd8ea;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:8px;padding:5px 10px}
.meta-chip b{color:#fff;font-weight:600}
.err-card{border-color:rgba(255,107,107,.4);background:linear-gradient(180deg,rgba(255,107,107,.12),rgba(22,29,41,.85))}
.err-card .big{font-size:17px;font-weight:600;color:#ffd7d7;margin:0 0 6px}
.err-card ul{margin:6px 0 0;padding-left:20px;color:var(--dim);font-size:13.5px}
.step{padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.025);margin-bottom:10px}
.step .st{font-size:14.5px;font-weight:600;color:#a9c8f0;margin:0 0 6px}
.step .line{font-family:"Cascadia Mono",Consolas,monospace;font-size:14.5px;color:#e2ebf7;padding:2px 0;word-break:break-word}
.plot-wrap{position:relative}
canvas{width:100%;height:260px;display:block;border-radius:12px;background:#0b1220;border:1px solid var(--line)}
.plot-note{color:var(--dim);font-size:13px;margin:8px 2px 0}
.range-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--dim)}
.num-input{
  width:96px;padding:7px 9px;color:var(--txt);background:#0b1220;border:1px solid rgba(255,255,255,.14);
  border-radius:9px;font-family:"Cascadia Mono",Consolas,monospace;font-size:13.5px;outline:none;
}
.num-input:focus{border-color:var(--acc)}
/* 折叠区块（函数图像 / 解题步骤 / 历史记录） */
.fold{
  background:var(--card); border:1px solid var(--line); border-radius:16px; margin-bottom:16px;
  backdrop-filter:blur(8px); box-shadow:0 12px 34px rgba(0,0,0,.28); overflow:hidden;
}
.fold>summary{
  list-style:none; cursor:pointer; user-select:none; padding:15px 18px;
  display:flex; align-items:center; gap:10px; font-size:15px; letter-spacing:.8px; color:#dbe6f5;
  transition:background .16s;
}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::marker{content:''}
.fold>summary:hover{background:rgba(255,255,255,.045)}
.fold>summary::after{
  content:''; flex:0 0 auto; width:8px; height:8px; margin-left:10px;
  border-right:2px solid #8fa3bd; border-bottom:2px solid #8fa3bd;
  transform:rotate(-45deg); transition:transform .2s;
}
.fold[open]>summary::after{transform:rotate(45deg)}
.fold-meta{margin-left:auto;font-size:12.5px;color:var(--dim);white-space:nowrap}
.fold-body{padding:0 18px 18px}
.chip{
  font-family:"Cascadia Mono",Consolas,monospace; font-size:13.5px; color:#cfe0f5; cursor:pointer;
  background:rgba(255,255,255,.05); border:1px solid var(--line); border-radius:999px; padding:6px 13px; transition:.16s;
}
.chip:hover{background:rgba(79,157,255,.18);border-color:rgba(79,157,255,.5);color:#fff}
.history{display:flex;flex-wrap:wrap;gap:8px}
.foot{color:#6f7f96;font-size:12.5px;text-align:center;margin-top:22px}
.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
  background:#1d283a;color:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 18px;
  opacity:0;transition:.25s;pointer-events:none;font-size:14px;z-index:9;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:600px){
  body{padding:18px 10px 50px}
  .btn{padding:13px 16px}
  #eq{font-size:17px}
}

    if (n <= 0) return [P.ZERO];
    const b = new Array(n);
    let acc = new Frac(0);
    for (let k = n - 1; k >= 0; k--) {

  /** 复系数 Horner（数值），系数是 number 数组（升幂） */

    return v;
  }

  /**
   * Durand–Kerner：同时迭代逼近 n 个复根。

   * @returns {Array<{re:number, im:number}>}
   */
  function numericRoots(coeffs) {
    const n = coeffs.length - 1;
    if (n < 1) return [];
    const lead = coeffs[n];
    const monic = coeffs.map(function (c) { return c / lead; });   // 首一
    const zs = [];
    for (let k = 0; k < n; k++) {
      const t = 2 * Math.PI * (k + 0.5) / n;
      zs.push(C.make(0.4 + 0.9 * Math.cos(t), 0.4 + 0.9 * Math.sin(t)));
    }
    for (let iter = 0; iter < 1200; iter++) {
      let moved = 0;
      for (let i = 0; i < n; i++) {
        const v = evalNumeric(monic, zs[i]);
        let d = C.make(1, 0);
        for (let j = 0; j < n; j++) {
          if (j === i) continue;
          const pair = C.sub(zs[i], zs[j]);
          if (C.modulus(pair) < 1e-280) { d = C.make(0, 0); break; }
          d = C.mul(d, pair);
        }
        if (C.modulus(d) < 1e-280) continue;

      let v = { re: z.re, im: Math.abs(z.im) < 1e-9 * scale ? 0 : z.im };
      for (let k = 0; k < 3; k++) {
        const fv = evalNumeric(monic, v);
        if (C.modulus(fv) < 1e-15) break;

        for (let i = 1; i < monic.length; i++) dv.push(i * monic[i]);

        if (C.modulus(d) < 1e-280) break;
        v = C.sub(v, C.div(fv, d));

      const s2 = Math.max(1, Math.abs(v.re));
      if (Math.abs(v.im) < 1e-9 * s2) v = C.make(v.re, 0);

      re: num, im: 0, complex: false, mult: 1
    };
  }

    const text = F.fmtComplex(z, 6);
    return {
      exact: text, display: '≈ ' + text, approx: real ? z.re : null,
      re: z.re, im: z.im, complex: !real, mult: 1, numeric: true

  }

  /** 剩余二次因式 ax²+bx+c 的精确根（顺序：小根在前；复数根 +i 在前） */
  function quadraticRoots(a, b, c, v) {

    const delta = b.mul(b).sub(a.mul(c).mul(new Frac(4n)));
    if (delta.isZero()) {
      return { delta: delta, kind: 'double', roots: [realRootDescriptor(b.neg().div(twoA))] };

        ]
      };

    const pair = Q.radicalPair(a, b, sqp.s, sqp.M, sqp.Q);
    const c1 = Q.complexNumber(pair, +1), c2 = Q.complexNumber(pair, -1);

        { exact: e2, display: e2, approx: null, re: c2.re, im: c2.im, complex: true, mult: 1 }
      ]

      '思路：先用「有理根定理」找出能整除的有理根，用综合除法逐次降次；',

        'a = ' + F.fmtFrac(rest[2]) + '，b = ' + F.fmtFrac(rest[1]) + '，c = ' + F.fmtFrac(rest[0]),
        'Δ = b² - 4ac = ' + F.fmtFracBoth(q.delta)];
      if (q.kind === 'double') {
        lines.push('Δ = 0，二次因式是完全平方，得到一个二重根：' + v + ' = ' + F.fmtFrac(q.roots[0].exact));

      } else if (q.kind === 'complex') {
        lines.push('Δ < 0，在实数范围内没有解，复数范围内有两个共轭虚根。');
        lines.push('这两个根：' + v + ' = ' + q.roots[0].exact + ' 与 ' + v + ' = ' + q.roots[1].exact);
      } else {
        lines.push('Δ > 0，两个实根：' + v + ' = ' + q.roots[0].display + ' 与 ' + v + ' = ' + q.roots[1].display);

        restText + ' = 0 没有有理根，也没有现成的公式。',
        '用 Durand–Kerner 迭代：把 ' + restDeg + ' 个根当成复平面上的 ' + restDeg + ' 个点同时迭代，直到每个点都落在自己的根上。',

    const merged = [];
    roots.forEach(function (r) {
      const tol = 1e-9 * Math.max(1, Math.abs(r.re), Math.abs(r.im));
      const hit = merged.filter(function (o) {
        return o.complex === r.complex &&
          Math.abs(o.re - r.re) <= tol && Math.abs(o.im - r.im) <= tol;

      if (hit) hit.mult = (hit.mult || 1) + (r.mult || 1);

    merged.forEach(function (r) { roots.push(r); });

      return q.im - p.im;

    const solutionLines = [];
    roots.forEach(function (r, i) {
      const mult = r.mult > 1 ? '（' + (r.mult === 2 ? '二重根' : r.mult + ' 重根') + '）' : '';

        ? v + subscript(i + 1) + (r.numeric ? ' ≈ ' : ' = ') + r.exact + mult
        : v + (r.numeric ? ' ≈ ' : ' = ') + r.exact + mult;
      r.expr = label;
      solutionLines.push(label);

    else if (totalMult === roots.length) conclusion = '方程在复数范围内共有 ' + roots.length + ' 个根。';

      typeName: typeName,
      solutionType: 'high-degree',
      roots: roots,
      solutionLines: solutionLines,
      solutionText: solutionLines.join('，'),
      hasRealRoots: hasReal,
      delta: null,
      coefficients: { degree: deg, list: coeffList.join('、') },

        kind: 'expr',
        expr: F.polyToText(poly, v),
        coeffs: poly.map(function (c) { return c.toNumber(); }),
        realRoots: roots.filter(function (r) { return !r.complex && isFinite(r.re); }).map(function (r) { return r.re; }),

// SPDX-License-Identifier: MIT
/* 界面模块：把绘图模型画到 canvas 上（网格、坐标轴、曲线、交点、顶点、渐近线） */
(function (NS) {
  'use strict';
  const UIN = NS.ui = NS.ui || {};
  const F = NS.fmt;

  function niceNum(v, digits) {
    const s = F.numToStr(v, digits || 4);
    return s === '-0' ? '0' : s;
  }

  /**
   * @param {HTMLCanvasElement} canvas
   * @param {object} model NS.plot.build() 的结果
   */
  function drawPlot(canvas, model) {
    if (!canvas || !model || !model.ok) return false;
    const hasCurve = model.segments && model.segments.length > 0;
    const w = canvas.clientWidth || 640;
    const h = canvas.clientHeight || 260;
    const dpr = (typeof window !== 'undefined' && window.devicePixelRatio) || 1;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    const ctx = canvas.getContext('2d');
    if (!ctx) return false;
    if (ctx.setTransform) ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);

    const padL = 48, padR = 18, padT = 18, padB = 28;
    const plotW = Math.max(10, w - padL - padR);
    const plotH = Math.max(10, h - padT - padB);
    const px = function (x) { return padL + (x - model.xMin) / (model.xMax - model.xMin) * plotW; };
    const py = function (y) { return h - padB - (y - model.yMin) / (model.yMax - model.yMin) * plotH; };

    /* 网格与刻度 */
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(255,255,255,.07)';
    ctx.font = '11px Consolas, monospace';
    ctx.fillStyle = '#7b8ba3';
    model.xTicks.forEach(function (t) {
      const X = Math.round(px(t)) + .5;
      ctx.beginPath(); ctx.moveTo(X, padT); ctx.lineTo(X, h - padB); ctx.stroke();
      ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.fillText(niceNum(t), X, h - padB + 6);
    });
    model.yTicks.forEach(function (t) {
      const Y = Math.round(py(t)) + .5;
      ctx.beginPath(); ctx.moveTo(padL, Y); ctx.lineTo(w - padR, Y); ctx.stroke();
      ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
      ctx.fillText(niceNum(t), padL - 7, Y);
    });

    /* 坐标轴 */
    ctx.strokeStyle = 'rgba(255,255,255,.38)';
    ctx.lineWidth = 1.3;
    if (model.yMin <= 0 && model.yMax >= 0) {
      const Y = Math.round(py(0)) + .5;
      ctx.beginPath(); ctx.moveTo(padL, Y); ctx.lineTo(w - padR, Y); ctx.stroke();
    }
    if (model.xMin <= 0 && model.xMax >= 0) {
      const X = Math.round(px(0)) + .5;
      ctx.beginPath(); ctx.moveTo(X, padT); ctx.lineTo(X, h - padB); ctx.stroke();
    }

    /* 竖直渐近线（虚线） */
    if (model.pole !== null && model.pole !== undefined &&
        model.pole > model.xMin && model.pole < model.xMax) {
      const X = Math.round(px(model.pole)) + .5;
      ctx.save();
      ctx.setLineDash([4, 4]);
      ctx.strokeStyle = 'rgba(255,176,32,.55)';
      ctx.beginPath(); ctx.moveTo(X, padT); ctx.lineTo(X, h - padB); ctx.stroke();
      ctx.restore();
    }

    /* 曲线：裁剪在绘图区内，极值不会画到坐标轴文字上 */
    if (hasCurve) {
      ctx.save();
      ctx.beginPath();
      ctx.rect(padL, padT, plotW, plotH);
      ctx.clip();
      ctx.strokeStyle = '#5aa9ff';
      ctx.lineWidth = 2.2;
      ctx.lineJoin = 'round';
      model.segments.forEach(function (seg) {
        ctx.beginPath();
        seg.forEach(function (pt, i) {
          const X = px(pt.x), Y = py(pt.y);
          if (i === 0) ctx.moveTo(X, Y); else ctx.lineTo(X, Y);
        });
        ctx.stroke();
      });
      ctx.restore();
    }

    /* 顶点 */
    if (model.vertex && isFinite(model.vertex.x) && isFinite(model.vertex.y)) {
      const vx = px(model.vertex.x), vy = py(model.vertex.y);
      ctx.fillStyle = '#c3b2ff';
      ctx.beginPath(); ctx.arc(vx, vy, 3.6, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#9d8cf0'; ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
      ctx.fillText('顶点', vx + 7, vy - 5);
    }

    /* 与 x 轴的交点 */
    (model.roots || []).forEach(function (r) {
      const X = px(r), Y = py(0);
      if (X < padL - 2 || X > w - padR + 2) return;
      ctx.fillStyle = '#35d39a';
      ctx.beginPath(); ctx.arc(X, Y, 4.6, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#7ff0c4'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.fillText(niceNum(r), X, Y + 7);
    });

    /* 左上角的函数说明 */
    ctx.fillStyle = '#93a2b8';
    ctx.font = '12px Consolas, monospace';
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillText('y = ' + model.expr + '   [' + model.kindLabel + ']', padL + 4, padT + 2);
    return true;
  }

  UIN.drawPlot = drawPlot;
  UIN.niceNum = niceNum;

  function foldStates() {
    try { return JSON.parse(localStorage.getItem(FOLD_KEY)) || {}; } catch (e) { return {}; }
  }
  function foldState(key, def) {
    const s = foldStates();
    return Object.prototype.hasOwnProperty.call(s, key) ? !!s[key] : !!def;
  }
  function saveFold(key, open) {
    try {
      const s = foldStates();

      '绘图：以 plot 开头，只支持一个变量 x，例如 plot sin(x)、plot 1/x',
      '整式方程里未知数不能出现在分母中，也不能出现在 sin、log 这类函数里',
      '次数最高支持 10 次左右（先用有理根定理降次，再用数值方法求其余根）'
    ].forEach(t => ul.appendChild(el('li', null, t)));
    card.appendChild(ul);
    return card;
  }

  /* ---------------- 总入口 ---------------- */
  function equationPlotCard(res) {
    if (!res.plot || res.plot.kind === 'constant') return null;
    const expr = res.plot.expr || res.standard;
    if (!expr) return null;
    let model;
    try {
      model = NS.plot.build(expr, { useDegree: NS.settings.useDegree, ans: NS.settings.ans });
    } catch (err) { model = { ok: false }; }
    if (!model.ok) return null;
    const meta = res.plot.kind === 'line'
      ? '直线与 x 轴的交点就是方程的根'
      : (res.plot.realRoots && res.plot.realRoots.length ? '曲线与 x 轴的交点就是方程的根' : '曲线与 x 轴没有交点');
    return plotCard(model, { key: 'plot', meta: meta });
  }

  function render(container, res) {
    plotState = null;
    clear(container);
    if (!res || !res.ok) {
      container.appendChild(errorCard((res && res.error) || '未知错误'));
      return;
    }
    if (res.mode === 'calc') {
      container.appendChild(calcCard(res));
      return;
    }
    if (res.mode === 'plot') {
      container.appendChild(plotCard(res.model, { key: 'plotcmd', open: true }));
      redrawPlot();
      return;
    }
    container.appendChild(solutionCard(res));
    const pc = equationPlotCard(res);
    if (pc) {
      container.appendChild(pc);
      redrawPlot();
    }
    container.appendChild(stepsCard(res));
  }

  function redrawPlot() {
    if (plotState && plotState.canvas && plotState.model && document.body.contains(plotState.canvas)) {
      NS.ui.drawPlot(plotState.canvas, plotState.model);
    }
  }

  function toast(msg) {
    const t = document.getElementById('toast');
    if (!t) return;
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toast._timer);
    toast._timer = setTimeout(() => t.classList.remove('show'), 1700);
  }

  NS.ui.render = render;
  NS.ui.redrawPlot = redrawPlot;
  NS.ui.toast = toast;
  NS.ui.clear = clear;
  NS.ui.el = el;
  NS.ui.makeFold = makeFold;
  NS.ui.foldState = foldState;
  NS.ui.saveFold = saveFold;
  NS.ui.plotCard = plotCard;
})(typeof globalThis !== 'undefined' ? (globalThis.__EqSolver = globalThis.__EqSolver || {}) : this);

// SPDX-License-Identifier: MIT
/* 界面模块：事件绑定、历史记录、复制、角度制切换、折叠状态 */
(function (NS) {
  'use strict';
  const UIN = NS.ui;
  const STORE_KEY = 'eq-solver-history-v1';
  const ANGLE_KEY = 'eq-solver-angle-v1';
  let lastRes = null;

  function loadHistory() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      const arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr.slice(0, 12) : [];
    } catch (e) { return []; }
  }
  function saveHistory(arr) {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(arr.slice(0, 12))); } catch (e) { /* 忽略 */ }
  }

  function boot() {
    const input = document.getElementById('eq');
    const solveBtn = document.getElementById('solveBtn');
    const copyBtn = document.getElementById('copyBtn');
    const angleBtn = document.getElementById('angleBtn');
    const resultEl = document.getElementById('result');
    const historyCard = document.getElementById('historyCard');
    const historyEl = document.getElementById('history');
    const historyMeta = document.getElementById('historyMeta');
    if (!input || !resultEl) return;

    /* ---- 角度制 / 弧度制（记住上次的选择） ---- */
    try {
      const saved = localStorage.getItem(ANGLE_KEY);
      if (saved === 'rad' || saved === 'deg') NS.setAngleMode(saved);
    } catch (e) { /* 忽略 */ }

    function paintAngle() {
      if (!angleBtn) return;
      const deg = NS.settings.useDegree;
      angleBtn.textContent = deg ? '角度制 DEG' : '弧度制 RAD';
      if (angleBtn.setAttribute) angleBtn.setAttribute('data-mode', deg ? 'deg' : 'rad');
      angleBtn.title = deg ? '三角函数当前按角度计算（点击切换为弧度制）' : '三角函数当前按弧度计算（点击切换为角度制）';
    }

    let history = loadHistory();

    function renderHistory() {
      if (!historyEl) return;
      UIN.clear(historyEl);
      if (historyCard) historyCard.hidden = history.length === 0;
      if (historyMeta) historyMeta.textContent = history.length ? '共 ' + history.length + ' 条' : '';
      history.forEach(q => {
        const chip = UIN.el('button', 'chip', q);
        chip.type = 'button';
        chip.addEventListener('click', () => { input.value = q; doSolve(); });
        historyEl.appendChild(chip);
      });
    }

    function pushHistory(q) {
      const key = q.replace(/\s+/g, '');
      history = [q].concat(history.filter(x => x.replace(/\s+/g, '') !== key)).slice(0, 12);
      saveHistory(history);
      renderHistory();
    }

    function doSolve() {
      const text = input.value;
      const res = NS.compute(text);
      lastRes = res;
      UIN.render(resultEl, res);
      if (res.ok) pushHistory(text.trim().replace(/\s+/g, ' '));
      if (window.innerWidth < 760) {
        resultEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }

    solveBtn.addEventListener('click', doSolve);
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); doSolve(); }
    });

    if (angleBtn) {
      angleBtn.addEventListener('click', () => {
        const deg = !NS.settings.useDegree;
        NS.setAngleMode(deg ? 'deg' : 'rad');
        try { localStorage.setItem(ANGLE_KEY, deg ? 'deg' : 'rad'); } catch (e) { /* 忽略 */ }
        paintAngle();
        UIN.toast(deg ? '三角函数改用角度制（sin(30) = 0.5）' : '三角函数改用弧度制（sin(pi/2) = 1）');
        if (input.value.trim()) doSolve();
      });
    }

    if (copyBtn) {
      copyBtn.addEventListener('click', () => {
        if (!lastRes) { UIN.toast('请先计算一个结果'); return; }
        const text = NS.formatReport(lastRes);
        const ok = () => UIN.toast('解答已复制到剪贴板');
        const fail = () => UIN.toast('复制失败，请手动选择文本');
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(ok, () => fallbackCopy(text) ? ok() : fail());
        } else {
          fallbackCopy(text) ? ok() : fail();
        }
      });
    }

    /* 历史记录也是折叠区块：记住展开状态 */
    if (historyCard) {
      historyCard.open = UIN.foldState('history', false);
      historyCard.addEventListener('toggle', () => UIN.saveFold('history', historyCard.open));
    }

    let rt = null;
    window.addEventListener('resize', () => {
      clearTimeout(rt);
      rt = setTimeout(() => UIN.redrawPlot(), 120);
    });

    paintAngle();
    renderHistory();
    input.focus();
  }

  function fallbackCopy(text) {
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    } catch (e) { return false; }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})(typeof globalThis !== 'undefined' ? (globalThis.__EqSolver = globalThis.__EqSolver || {}) : this);

</script>
