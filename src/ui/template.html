<!DOCTYPE html>
<!-- SPDX-License-Identifier: MIT -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数学计算器 · 方程 / 算式 / 绘图</title>
<style>
:root{
  --bg:#0d1117; --bg2:#141a24; --card:rgba(22,29,41,.82); --line:rgba(255,255,255,.09);
  --txt:#e8eef7; --dim:#93a2b8; --acc:#4f9dff; --acc2:#7c5cff; --ok:#35d39a; --warn:#ffb020; --err:#ff6b6b;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1100px 600px at 12% -8%, rgba(79,157,255,.20), transparent 60%),
    radial-gradient(900px 500px at 92% 4%, rgba(124,92,255,.18), transparent 62%),
    var(--bg);
  color:var(--txt); min-height:100vh;
  font-family:"Segoe UI","Microsoft YaHei","PingFang SC",system-ui,-apple-system,sans-serif;
  font-size:16px; line-height:1.62; padding:28px 16px 60px;
}
.app{max-width:960px;margin:0 auto}
.hero h1{
  margin:0 0 6px; font-size:clamp(26px,4.2vw,38px); letter-spacing:.5px;
  background:linear-gradient(92deg,#8fc4ff,#c3b2ff 60%,#7ef0d0);
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.hero .sub{margin:0 0 22px;color:var(--dim);font-size:14.5px}
.card{
  background:var(--card); border:1px solid var(--line); border-radius:16px;
  padding:18px 18px 16px; margin-bottom:16px; backdrop-filter:blur(8px);
  box-shadow:0 12px 34px rgba(0,0,0,.28);
}
.lbl{display:block;font-size:13px;color:var(--dim);margin-bottom:8px;letter-spacing:.6px}
.input-row{display:flex;gap:10px;flex-wrap:wrap}
#eq{
  flex:1 1 320px; min-width:0; padding:15px 16px; font-size:19px; color:var(--txt);
  background:#0b1220; border:1px solid rgba(255,255,255,.14); border-radius:12px;
  font-family:"Cascadia Mono",Consolas,"Courier New",monospace; outline:none; transition:.18s;
}
#eq:focus{border-color:var(--acc);box-shadow:0 0 0 4px rgba(79,157,255,.16)}
#eq::placeholder{color:#5a6a80}
.btn{
  padding:14px 22px; font-size:16px; font-weight:600; color:#fff; cursor:pointer;
  border:1px solid rgba(255,255,255,.14); border-radius:12px; background:#1d2637; transition:.18s;
}
.btn:hover{transform:translateY(-1px);background:#243044}
.btn.primary{background:linear-gradient(96deg,var(--acc),var(--acc2));border-color:transparent}
.btn.primary:hover{box-shadow:0 8px 22px rgba(79,157,255,.32)}
.btn.small{padding:8px 14px;font-size:13.5px;border-radius:10px}
.btn.ghost{background:rgba(255,255,255,.04)}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.toolbar .tag{font-size:12.5px;color:var(--dim)}
#angleBtn{min-width:112px;font-family:"Cascadia Mono",Consolas,monospace}
#angleBtn[data-mode="rad"]{border-color:rgba(79,157,255,.55);color:#bcd9ff}
.hint{margin:10px 2px 0;color:var(--dim);font-size:13px}
.hint code,.mono{font-family:"Cascadia Mono",Consolas,monospace;color:#bcd4f0;background:rgba(255,255,255,.06);padding:1px 6px;border-radius:6px}
kbd{font-family:inherit;font-size:12px;background:rgba(255,255,255,.1);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.sol-card{border-color:rgba(53,211,154,.32);background:linear-gradient(180deg,rgba(53,211,154,.10),rgba(22,29,41,.85))}
.sol-card.warn{border-color:rgba(255,176,32,.34);background:linear-gradient(180deg,rgba(255,176,32,.10),rgba(22,29,41,.85))}
.calc-card{border-color:rgba(79,157,255,.34);background:linear-gradient(180deg,rgba(79,157,255,.10),rgba(22,29,41,.85))}
.sol-title{font-size:13px;color:var(--dim);letter-spacing:1px;margin:0 0 8px}
.sol-big{font-size:clamp(20px,3.4vw,27px);font-weight:600;line-height:1.5;word-break:break-word;font-family:"Cascadia Mono",Consolas,monospace}
.sol-big .ln{display:block}
.sol-sub{margin-top:6px;color:var(--dim);font-size:13.5px}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.meta-chip{font-size:12.5px;color:#cbd8ea;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:8px;padding:5px 10px}
.meta-chip b{color:#fff;font-weight:600}
.err-card{border-color:rgba(255,107,107,.4);background:linear-gradient(180deg,rgba(255,107,107,.12),rgba(22,29,41,.85))}
.err-card .big{font-size:17px;font-weight:600;color:#ffd7d7;margin:0 0 6px}
.err-card ul{margin:6px 0 0;padding-left:20px;color:var(--dim);font-size:13.5px}
.step{padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.025);margin-bottom:10px}
.step .st{font-size:14.5px;font-weight:600;color:#a9c8f0;margin:0 0 6px}
.step .line{font-family:"Cascadia Mono",Consolas,monospace;font-size:14.5px;color:#e2ebf7;padding:2px 0;word-break:break-word}
.plot-wrap{position:relative}
canvas{width:100%;height:260px;display:block;border-radius:12px;background:#0b1220;border:1px solid var(--line)}
.plot-note{color:var(--dim);font-size:13px;margin:8px 2px 0}
.range-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--dim)}
.num-input{
  width:96px;padding:7px 9px;color:var(--txt);background:#0b1220;border:1px solid rgba(255,255,255,.14);
  border-radius:9px;font-family:"Cascadia Mono",Consolas,monospace;font-size:13.5px;outline:none;
}
.num-input:focus{border-color:var(--acc)}
/* 折叠区块（函数图像 / 解题步骤 / 历史记录） */
.fold{
  background:var(--card); border:1px solid var(--line); border-radius:16px; margin-bottom:16px;
  backdrop-filter:blur(8px); box-shadow:0 12px 34px rgba(0,0,0,.28); overflow:hidden;
}
.fold>summary{
  list-style:none; cursor:pointer; user-select:none; padding:15px 18px;
  display:flex; align-items:center; gap:10px; font-size:15px; letter-spacing:.8px; color:#dbe6f5;
  transition:background .16s;
}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::marker{content:''}
.fold>summary:hover{background:rgba(255,255,255,.045)}
.fold>summary::after{
  content:''; flex:0 0 auto; width:8px; height:8px; margin-left:10px;
  border-right:2px solid #8fa3bd; border-bottom:2px solid #8fa3bd;
  transform:rotate(-45deg); transition:transform .2s;
}
.fold[open]>summary::after{transform:rotate(45deg)}
.fold-meta{margin-left:auto;font-size:12.5px;color:var(--dim);white-space:nowrap}
.fold-body{padding:0 18px 18px}
.chip{
  font-family:"Cascadia Mono",Consolas,monospace; font-size:13.5px; color:#cfe0f5; cursor:pointer;
  background:rgba(255,255,255,.05); border:1px solid var(--line); border-radius:999px; padding:6px 13px; transition:.16s;
}
.chip:hover{background:rgba(79,157,255,.18);border-color:rgba(79,157,255,.5);color:#fff}
.history{display:flex;flex-wrap:wrap;gap:8px}
.foot{color:#6f7f96;font-size:12.5px;text-align:center;margin-top:22px}
.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
  background:#1d283a;color:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 18px;
  opacity:0;transition:.25s;pointer-events:none;font-size:14px;z-index:9;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:600px){
  body{padding:18px 10px 50px}
  .btn{padding:13px 16px}
  #eq{font-size:17px}
}
</style>
</head>
<body>
<div class="app">
  <header class="hero">
    <h1>数学计算器</h1>
    <p class="sub">方程求解（一次 / 二次 / 高次）&nbsp;·&nbsp; 复数与函数算式 &nbsp;·&nbsp; 函数图像 &nbsp;|&nbsp; 精确有理数 + 根式化简 + 分步讲解</p>
  </header>

  <section class="card">
    <label class="lbl" for="eq">输入方程、算式或绘图命令</label>
    <div class="input-row">
      <input id="eq" type="text" autocomplete="off" spellcheck="false"
             placeholder="2x + 3 = 5x - 9　|　x^3 = 8　|　sin(30) + 1/2　|　plot x^2 - 4">
      <button id="solveBtn" class="btn primary" type="button">计算</button>
      <button id="copyBtn" class="btn" type="button">复制解答</button>
    </div>
    <div class="toolbar">
      <span class="tag">三角函数单位</span>
      <button id="angleBtn" class="btn small ghost" type="button" data-mode="deg">角度制 DEG</button>
      <span class="tag">含 <code>x</code> 按方程处理，纯数值按算式处理，<code>plot</code> 开头画图像</span>
    </div>
    <p class="hint">
      方程：<code>2x+3=5x-9</code>、<code>x²-5x+6=0</code>、<code>x^3-8=0</code>；
      算式：<code>2^10</code>、<code>5!</code>、<code>(3+4i)/(1-2i)</code>、<code>log(2,8)</code>、<code>nCr(5,2)</code>；
      绘图：<code>plot sin(x)</code>、<code>plot 1/x</code>。按 <kbd>Enter</kbd> 直接计算，结果用精确有理数与根式表示。
    </p>
  </section>

  <div id="result"></div>

  <details class="fold" id="historyCard" hidden>
    <summary>历史记录<span class="fold-meta" id="historyMeta"></span></summary>
    <div class="fold-body">
      <div class="history" id="history"></div>
    </div>
  </details>

  <footer class="foot">方程 / 算式 / 绘图三合一计算器 · 结果含精确解与数值近似，可复制粘贴</footer>
</div>
<div class="toast" id="toast"></div>

<!-- DEV-SCRIPTS-START -->

<script src="src/05-complex.js"></script>

<script src="src/50-plot-model.js"></script>
<script src="src/90-entry.js"></script>
<script src="src/ui/app-plot.js"></script>
<script src="src/ui/app-core.js"></script>
<script src="src/ui/app-boot.js"></script>
<!-- DEV-SCRIPTS-END -->
</body>
</html>
